name: quality-gate

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.41.7"

jobs:
  dart-tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  core-tests:
    name: Core Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum
      - name: Run core tests
        working-directory: core
        run: go test ./...

  package-integrity:
    name: M3 package integrity checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run PowerShell package checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./engineering/m3-test-package/tests/Test-M3PackageTools.ps1
          ./engineering/m3-test-package/tests/Test-M3ManifestAssemblyOrder.ps1
          ./engineering/m3-test-package/tests/Test-M3EvidenceValidator.ps1
