name: quality-gate

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: "3.41.7"

jobs:
  dart-tests:
    name: Flutter tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Run tests
        run: flutter test

  core-tests:
    name: Core Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum
      - name: Run core tests
        working-directory: core
        run: |
          go run ./tools/mihomo-overlay
          go test -modfile=.generated/go.mod -overlay=.generated/mihomo-overlay.json ./...
          go test -modfile=.generated/go.mod -overlay=.generated/mihomo-overlay.json -tags=with_gvisor ./...
          go test -modfile=.generated/go.mod -overlay=.generated/mihomo-overlay.json -race -run '^TestFCXTun' github.com/metacubex/mihomo/listener

  windows-runtime-tests:
    name: Windows Core and service tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache-dependency-path: core/go.sum
      - name: Test Core Windows paths without creating TUN devices
        working-directory: core
        shell: pwsh
        run: |
          go run ./tools/mihomo-overlay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test '-modfile=.generated/go.mod' '-overlay=.generated/mihomo-overlay.json' '-tags=with_gvisor' ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test '-modfile=.generated/go.mod' '-overlay=.generated/mihomo-overlay.json' -run '^TestFCXTun' github.com/metacubex/mihomo/listener
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Agent and Helper contracts without installing services
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 test --locked --manifest-path services/agent/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.98.1 test --locked --features windows-service --manifest-path services/helper/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  package-integrity:
    name: M3 package integrity checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run PowerShell package checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./engineering/m3-test-package/tests/Test-M3PackageTools.ps1
          ./engineering/m3-test-package/tests/Test-M3ManifestAssemblyOrder.ps1
          ./engineering/m3-test-package/tests/Test-M3EvidenceValidator.ps1
          ./engineering/test-package/tests/Test-StrictTestValidation.ps1
