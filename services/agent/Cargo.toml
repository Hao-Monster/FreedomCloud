[package]
name = "flclash-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flclash-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
fs2 = "0.4"
flclash-strict-contract = { path = "../strict-contract" }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[target.'cfg(target_os = "macos")'.dependencies]
hmac = "0.12"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
flclash-strict-broker = { path = "../strict-broker" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
