[package]
name = "flclash-strict-broker"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
flclash-strict-contract = { path = "../strict-contract" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
