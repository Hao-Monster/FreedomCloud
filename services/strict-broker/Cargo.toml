[package]
name = "flclash-strict-broker"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "FlClashStrictBroker"
path = "src/bin/windows_strict_broker.rs"
required-features = ["production-host"]

[features]
production-host = ["dep:hmac"]

[dependencies]
anyhow = "1.0"
flclash-strict-contract = { path = "../strict-contract" }
hmac = { version = "0.12", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Rpc",
  "Win32_System_Services",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
